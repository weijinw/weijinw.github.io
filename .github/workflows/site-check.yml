name: Site checks

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Inspect Abyss Bloom PNG dimensions
        run: |
          python3 - <<'PY'
          import struct
          from pathlib import Path
          root = Path('alwayson/backgrounds/packages/abyss-bloom/1/assets')
          for p in sorted(root.glob('AbyssBloom*.png')):
              data = p.read_bytes()[:24]
              if data[:8] != b'\x89PNG\r\n\x1a\n':
                  print(f'{p.name}: not PNG')
                  continue
              w, h = struct.unpack('>II', data[16:24])
              print(f'ABYSS_DIM {p.name} {w}x{h}')
          PY

      - name: Preview Abyss Bloom source composition
        run: |
          if command -v montage >/dev/null 2>&1; then
            montage alwayson/backgrounds/packages/abyss-bloom/1/assets/AbyssBloomLandscape.png \
                    alwayson/backgrounds/packages/abyss-bloom/1/assets/AbyssBloomLandscape1.png \
                    alwayson/backgrounds/packages/abyss-bloom/1/assets/AbyssBloomLandscape2.png \
                    alwayson/backgrounds/packages/abyss-bloom/1/assets/AbyssBloomLandscape3.png \
                    alwayson/backgrounds/packages/abyss-bloom/1/assets/AbyssBloomPortrait.png \
                    alwayson/backgrounds/packages/abyss-bloom/1/assets/AbyssBloomPortrait1.png \
                    alwayson/backgrounds/packages/abyss-bloom/1/assets/AbyssBloomPortrait2.png \
                    alwayson/backgrounds/packages/abyss-bloom/1/assets/AbyssBloomPortrait3.png \
                    -thumbnail '220x220>' -tile 4x2 -geometry +4+4 -background '#111318' \
                    /tmp/abyss-source.jpg
            echo 'ABYSS_PREVIEW_BASE64_BEGIN'
            base64 -w0 /tmp/abyss-source.jpg
            echo
            echo 'ABYSS_PREVIEW_BASE64_END'
          else
            echo 'ImageMagick montage unavailable'
          fi

      - name: Validate static site
        run: python3 scripts/check_site.py

      - name: Test support form
        run: node scripts/test_support.js
