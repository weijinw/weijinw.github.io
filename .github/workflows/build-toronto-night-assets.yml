name: Build Toronto Night assets

on:
  push:
    branches:
      - dev
    paths:
      - "alwayson/backgrounds/packages/toronto-night/1/_source/READY"

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev

      - name: Reassemble source images
        shell: bash
        run: |
          set -euo pipefail
          src="alwayson/backgrounds/packages/toronto-night/1/_source"
          cat "$src"/portrait.b64.* | tr -d '\n' | base64 --decode > /tmp/portrait.jpg
          cat "$src"/landscape.b64.* | tr -d '\n' | base64 --decode > /tmp/landscape.jpg

      - name: Resize final assets
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image

          out = Path("alwayson/backgrounds/packages/toronto-night/1/assets")
          out.mkdir(parents=True, exist_ok=True)

          portrait = Image.open("/tmp/portrait.jpg").convert("RGB")
          portrait = portrait.resize((1536, 2752), Image.Resampling.LANCZOS)
          portrait.save(out / "TorontoNightPortrait.jpg", quality=80, optimize=True, progressive=True)

          landscape = Image.open("/tmp/landscape.jpg").convert("RGB")
          landscape = landscape.resize((2752, 1536), Image.Resampling.LANCZOS)
          landscape.save(out / "TorontoNightLandscape.jpg", quality=80, optimize=True, progressive=True)

          assert Image.open(out / "TorontoNightPortrait.jpg").size == (1536, 2752)
          assert Image.open(out / "TorontoNightLandscape.jpg").size == (2752, 1536)
          PY

      - name: Commit generated assets
        shell: bash
        run: |
          set -euo pipefail
          rm -rf alwayson/backgrounds/packages/toronto-night/1/_source
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A alwayson/backgrounds/packages/toronto-night/1
          git commit -m "Add Toronto Night background assets"
          git push origin HEAD:dev
