name: Temporary Abyss Bloom opening rebuild

on:
  push:
    branches:
      - improve/abyss-bloom-opening-transition
    paths:
      - .github/workflows/abyss-opening-temp.yml

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: improve/abyss-bloom-opening-transition
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image dependencies
        run: python -m pip install --quiet pillow numpy opencv-python-headless

      - name: Generate geometric opening frames
        run: python scripts/abyss_opening_temp.py

      - name: Commit generated images
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add alwayson/backgrounds/packages/abyss-bloom/1/assets/AbyssBloomLandscape*.png
          git add alwayson/backgrounds/packages/abyss-bloom/1/assets/AbyssBloomPortrait*.png
          git diff --cached --quiet && exit 0
          git commit -m 'Add geometric Abyss Bloom opening frames'
          git push origin HEAD:improve/abyss-bloom-opening-transition
