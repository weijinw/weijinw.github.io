name: Temporary Abyss Bloom rebuild

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  rebuild:
    if: ${{ github.head_ref == 'fix/abyss-bloom-source-derived' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out rebuild branch
        uses: actions/checkout@v4
        with:
          ref: fix/abyss-bloom-source-derived
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python3 -m pip install --quiet pillow

      - name: Rebuild frames from original artwork
        run: python3 scripts/rebuild_abyss_temp.py

      - name: Verify generated dimensions
        run: |
          python3 - <<'PY'
          import struct
          from pathlib import Path
          root = Path('alwayson/backgrounds/packages/abyss-bloom/1/assets')
          expected = {
              'AbyssBloomLandscape.png': (1672, 941),
              'AbyssBloomLandscape1.png': (1672, 941),
              'AbyssBloomLandscape2.png': (1672, 941),
              'AbyssBloomLandscape3.png': (1672, 941),
              'AbyssBloomPortrait.png': (941, 1672),
              'AbyssBloomPortrait1.png': (941, 1672),
              'AbyssBloomPortrait2.png': (941, 1672),
              'AbyssBloomPortrait3.png': (941, 1672),
          }
          for name, wanted in expected.items():
              p = root / name
              data = p.read_bytes()[:24]
              got = struct.unpack('>II', data[16:24])
              print(f'{name}: {got[0]}x{got[1]}')
              if got != wanted:
                  raise SystemExit(f'{name}: expected {wanted}, got {got}')
          PY

      - name: Commit generated assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add alwayson/backgrounds/packages/abyss-bloom/1/assets/AbyssBloomLandscape*.png
          git add alwayson/backgrounds/packages/abyss-bloom/1/assets/AbyssBloomPortrait*.png
          if git diff --cached --quiet; then
            echo 'No generated asset changes.'
            exit 0
          fi
          git commit -m 'Rebuild Abyss Bloom frames from original artwork [abyss-generated]'
          git push origin HEAD:fix/abyss-bloom-source-derived
